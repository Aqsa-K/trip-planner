<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winter Trip Planner</title>
  <meta name="description" content="A tiny trip budget planner. Built to be fixed by an agent loop.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Google+Sans+Code&display=swap">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#ffc30e">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div class="band">
    <header>
      <h1>Winter Trip Planner<span class="sparkle" aria-hidden="true"></span></h1>
      <a class="report" href="https://github.com/Aqsa-K/trip-planner/issues/new/choose" target="_blank" rel="noopener">Report a problem</a>
    </header>
  </div>
  <main id="app">
    <section class="card loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading your trip…</p>
    </section>
  </main>
  <footer>
    <span>Pehla Qadam Apps Bootcamp</span>
    <span>You are <code id="user">…</code> · <a href="#" id="reset">Reset sample trip</a></span>
  </footer>
</body>
</html>
