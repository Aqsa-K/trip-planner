name: Something's broken
description: Tell us what went wrong. Short is fine.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: "The trip says -24 days"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "26 Dec to 2 Jan should be 8 days"
  - type: dropdown
    id: rating
    attributes:
      label: How would you rate the app?
      options:
        - "⭐ 1"
        - "⭐⭐ 2"
        - "⭐⭐⭐ 3"
        - "⭐⭐⭐⭐ 4"
        - "⭐⭐⭐⭐⭐ 5"
    validations:
      required: true
